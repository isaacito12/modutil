name: Weekly GitHub Traffic + Release Stats

on:
  schedule:
    - cron: "0 0 * * 0"   # weekly, Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize history file
        run: |
          mkdir -p traffic-data
          [ ! -f traffic-data/history.json ] && echo "[]" > traffic-data/history.json

      - name: Collect and store traffic data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/collect-stats.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          
          if git diff --quiet traffic-data/ docs/; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add traffic-data/ docs/
          git commit -m "📊 Weekly traffic update $(date '+%Y-%m-%d')"
          git push
