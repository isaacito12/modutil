# Test and release pipeline
#
# This workflow runs tests and then creates a release zip file.
# The release zip file is created only when all tests passed.
#
# This workflow is triggered when the pushed commit is tagged as "v*",
# such as v1.0.0, v2.3.1, and so on.
# Alternatively, you can manually start in the repo page in github.
#
# In the local repo in your machine, add a tag. The tag text must start with "v"
# and follow the semantic versioning scheme.
#   git tag v1.0.0
#
# Then push the tagged commit to the remote, which will trigger this workflow.
#   git push origin v1.0.0
# Or push all tags.
#   git push --tags

# Copyright 2025 The MathWorks, Inc.

name: Test-and-Release

on:
  push:
    tags:
      - "v*.*.*"

  # Allow manual runs. (optional)
  workflow_dispatch:

# Make the repo writable to create releases and upload assets.
# This workflow requires this setting.
permissions:
  contents: write

jobs:

  test-and-release:

    runs-on: ubuntu-latest

    # Matrix strategy is used to run the job in various MATLAB versions.
    # For information about matrix strategy, see the documentation.
    # - Running variations of jobs in a workflow
    #   https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
    strategy:
      matrix:
        matlab_version: [R2025b]
        #matlab_version: [R2025b, R2026a]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Ensure tags and history available.
          # This workflow requires this setting.
          fetch-depth: 0

      - name: Set up MATLAB ${{ matrix.matlab_version }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab_version }}
          cache: true
          products: |
            Simulink
            Simscape
            Simscape_Electrical
            Simscape_Driveline

      - name: Start XVFB display server
        # Enable graphics using X11 virtual framebuffer in a headless Linux.
        # Some tests require graphics.
        run: |
          sudo apt-get install xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run tests in MATLAB
        uses: matlab-actions/run-command@v2
        with:
          # Commands below run within MATLAB.
          # The top folder of the repo is the initial working folder.
          # Run tests under the Release folder before the Devel folder
          # because running tests in the Devel folder needs MATLAB paths
          # which interfere with the tests in the Release.
          command: |
            cd Release
            buildtool CodeIssues TestAndReport
            cd ../Devel
            setup_paths
            buildtool CodeIssues TestAndReport

      - name: Verify Release folder exists and is non-empty
        run: |
          if [ ! -d "Release" ]; then
            echo "ERROR: 'Release' folder not found at repo root."
            exit 1
          fi
          if [ -z "$(ls -A Release)" ]; then
            echo "ERROR: 'Release' folder is empty."
            exit 1
          fi

      - name: Create ZIP from Release folder
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          TAG="${GITHUB_REF_NAME:-manual}"
          ARCHIVE="modutil-simscape-devel-${TAG}.zip"
          # Zip only the "Release" folder and its contents.
          # Exclude test-related artifacts.
          (cd Release && zip -r "../$ARCHIVE" . -x ".buildtool/**" "test-result/**")
          echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

      - name: Generate checksum (optional)
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"
          echo "CHECKSUM_NAME=${{ env.ARCHIVE_NAME }}.sha256" >> $GITHUB_ENV

      - name: Create the Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          # ${{ github.ref_name }} is a tag that triggered the workflow, e.g., v1.2.3
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.CHECKSUM_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
